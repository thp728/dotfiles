# T3 Code's default dark theme, the one palette Ghostty, starship, fzf and the editors use. Keys
# are T3's own token names in snake_case. Where each value comes from: docs/t3-theme.md.

[t3]
background = "#000000"
card = "#111111"              # also popover and surface-raised
message_surface = "#1e1e1e"
foreground = "#f5f5f5"
muted_foreground = "#a1a1a1"
border = "#ffffff14"
input = "#ffffff1c"
accent = "#ffffff0a"          # hover and selection fills
primary = "#346bf1"
error = "#fb414a"
error_text = "#ff6467"
success = "#00bc7d"
success_text = "#00d492"
warning = "#fe9a00"
warning_text = "#ffb900"
info = "#2b7fff"
info_text = "#51a2ff"

[t3.terminal]
background = "#000000"
foreground = "#f5f5f5"
cursor = "#b4cbff"
selection = "#b4cbff40"
selection_opaque = "#2d3340"  # selection over black, for tools that take no alpha
# VS Code's dark ANSI palette: black, red, green, yellow, blue, magenta, cyan, white, then bright.
ansi = [
  "#000000", "#cd3131", "#0dbc79", "#e5e510", "#2472c8", "#bc3fbc", "#11a8cd", "#e5e5e5",
  "#666666", "#f14c4c", "#23d18b", "#f5f543", "#3b8eea", "#d670d6", "#29b8db", "#e5e5e5",
]
