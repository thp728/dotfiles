{{- /* chezmoi:modify-template */ -}}
{{- /*
Sets the keys in .codex (from .chezmoidata/codex.toml) and keeps the rest. While they already
match, the file passes through untouched. Otherwise it's rewritten from the parsed TOML.
*/ -}}
{{- $current := dict }}
{{- if .chezmoi.stdin }}{{ $current = fromToml .chezmoi.stdin }}{{ end }}
{{- $merged := dict }}
{{- range $key, $value := $current }}{{ $_ := set $merged $key $value }}{{ end }}
{{- range $key, $value := .codex }}
{{-   if kindIs "map" $value }}
{{-     $table := dict }}
{{-     range $k, $v := (get $merged $key | default dict) }}{{ $_ := set $table $k $v }}{{ end }}
{{-     range $k, $v := $value }}{{ $_ := set $table $k $v }}{{ end }}
{{-     $_ := set $merged $key $table }}
{{-   else }}
{{-     $_ := set $merged $key $value }}
{{-   end }}
{{- end }}
{{- if eq (toJson $current) (toJson $merged) }}
{{- .chezmoi.stdin }}
{{- else }}
{{- toToml $merged }}
{{- end -}}
